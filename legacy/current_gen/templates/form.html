<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Name}} - pod</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
<h1>{{.Name}}</h1>
<p>Form ID: {{.ID}}</p>
<a href="/" class="back">Back to Forms</a>
</header>
<main>
<section class="form-display">
<form action="/submit" method="POST" class="submission-form">
<input type="hidden" name="_form_id" value="{{.ID}}">
{{range .Fields}}
<div class="field">
<label for="{{.Name}}">{{.Label}}</label>
{{if eq .Type "textarea"}}
<textarea name="{{.Name}}" id="{{.Name}}" {{if .Required}}required{{endif}}></textarea>
{{else}}
<input type="{{.Type}}" name="{{.Name}}" id="{{.Name}}" {{if .Required}}required{{endif}}>
{{end}}
</div>
{{end}}
<button type="submit" class="button">Submit</button>
</form>
</section>
<section class="query">
<h2>Query Submissions</h2>
<div class="query-controls">
<input type="text" id="query-input" placeholder="Search field values...">
<button id="query-btn" class="button secondary">Filter</button>
</div>
<div id="query-results"></div>
</section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
